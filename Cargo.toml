[package]
name = "gra-rust-bevy-spike"
version = "0.1.0"
edition = "2024"

# The Bevy host is ON HOLD until the pure Rust truth-layer boundary passes
# the compiler gate (fmt, clippy -D warnings, test, run). The dependencies
# stay pinned behind an off-by-default feature so the default build is the
# pure boundary and the gate stays fast and deterministic.
[features]
default = []
bevy-host = ["dep:bevy", "dep:bevy_ecs"]

[dependencies]
bevy = { version = "0.19", optional = true }
bevy_ecs = { version = "0.19", optional = true }
