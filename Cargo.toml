[package]
name = "gra-rust-bevy-spike"
version = "0.1.0"
edition = "2024"

# Bevy is an optional execution/testing host for the pure Rust truth layer.
# The dependencies stay pinned behind off-by-default features so the
# canonical boundary gate remains fast, deterministic, and engine-independent.
# `bevy-host` is the ECS-only host adapter (trial/002 parity gate),
# feature-minimized by trial/D01: the adapter needs only `std` — reflect,
# async_executor, and backtrace are unallocated capabilities and stay
# disabled until a named consumer and gate justify them.
# `bevy-full` layers the whole engine on top for rendering/interaction work.
# `rs01-render` (trial RS01) is the capability-scoped renderer feature:
# window/input/2D/text/UI plus png for screenshot capture. The bevy `2d`
# meta-feature transitively carries default_app/default_platform surplus
# (gilrs, clipboard, webgl2, scene, picking, sysinfo) — recorded in
# docs/rs01-report.md as capability surplus with no RS01 consumer.
[features]
default = []
bevy-host = ["dep:bevy_ecs"]
bevy-full = ["bevy-host", "bevy/default"]
rs01-render = ["bevy-host", "dep:bevy"]

[dependencies]
bevy = { version = "0.19", optional = true, default-features = false, features = [
    "2d",
    "bevy_text",
    "png",
] }
bevy_ecs = { version = "0.19", optional = true, default-features = false, features = ["std"] }
